<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TừĐiển Pro - Hệ Thống Mapping IPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1a1a2e; --card: #16213e; --yellow: #ffd166; --green: #06d6a0; --text: #eaeaea; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); padding: 20px 16px; }
        header { text-align: center; margin-bottom: 25px; }
        .logo { font-family: 'Baloo 2', cursive; font-size: 32px; color: var(--yellow); }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 18px; background: var(--card); border: 2px solid rgba(255,209,102,0.2); border-radius: 18px; color: #fff; font-size: 18px; outline: none; }
        .search-btn { background: var(--yellow); border: none; width: 60px; border-radius: 18px; font-size: 22px; cursor: pointer; }
        .result-card { background: var(--card); border-radius: 25px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .word-en { font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .ipa-label { color: #8899bb; font-size: 14px; margin-bottom: 10px; display: block; }
        .viet-phonetic { font-size: 28px; color: var(--green); background: rgba(6,214,160,0.1); padding: 25px; border-radius: 20px; text-align: center; margin: 20px 0; border: 2px solid var(--green); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .meaning-text { font-size: 22px; font-weight: 700; color: #fff; border-top: 1px solid #ffffff1a; padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">TừĐiển Pro</div>
        <p style="font-size: 12px; color: #8899bb">Hệ thống chuyển đổi IPA sang âm bồi Việt Nam</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Vd: Digital, Different..." autocomplete="off">
        <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>

    <div id="mainContent"></div>

<script>
// "TRÁI TIM" CỦA APP: BẢNG MAPPING IPA SANG TIẾNG VIỆT
const ipaMap = {
    // Nguyên âm đơn
    'iː': 'i', 'ɪ': 'i', 'e': 'e', 'æ': 'e', 'ɑː': 'a', 'ɒ': 'o', 'ɔː': 'o', 'ʊ': 'u', 'uː': 'u', 'ʌ': 'ă', 'ɜː': 'ơ', 'ə': 'ơ',
    // Nguyên âm đôi
    'eɪ': 'êi', 'aɪ': 'ai', 'ɔɪ': 'oi', 'aʊ': 'ao', 'əʊ': 'âu', 'ɪə': 'ia', 'eə': 'e-ơ', 'ʊə': 'ua',
    // Phụ âm đặc biệt
    'p': 'p', 'b': 'b', 't': 't', 'd': 'd', 'k': 'c', 'g': 'g', 'f': 'ph', 'v': 'v', 'θ': 'th', 'ð': 'đ', 's': 'x', 'z': 'z',
    'ʃ': 'sh', 'ʒ': 'd', 'h': 'h', 'm': 'm', 'n': 'n', 'ŋ': 'ng', 'l': 'l', 'r': 'r', 'j': 'i', 'w': 'u',
    'tʃ': 'ch', 'dʒ': 'giờ'
};

function processIPA(ipa) {
    if (!ipa) return "";

    // 1. Chuẩn hóa chuỗi IPA (Xóa dấu / và các ký tự phụ)
    let raw = ipa.toLowerCase().replace(/[\/\.\(\)ˌ]/g, '').trim();

    // 2. Xử lý trọng âm (ˈ) thành dấu SẮC (´)
    // Tìm dấu ˈ, lấy âm tiếp theo và gán dấu sắc
    raw = raw.replace(/ˈ([^aeiouăơêôiy]*)([aeiouæɑɒɔəʊʌiuv])/g, '$1$2́');
    raw = raw.replace(/ˈ/g, '');

    // 3. Tiến hành Mapping
    // Sắp xếp các khóa của ipaMap theo độ dài giảm dần để ưu tiên âm phức (ch, giờ, ai...)
    const sortedKeys = Object.keys(ipaMap).sort((a, b) => b.length - a.length);
    
    let result = raw;
    sortedKeys.forEach(key => {
        const regex = new RegExp(key, 'g');
        result = result.replace(regex, ipaMap[key]);
    });

    // 4. Hậu xử lý (Làm cho âm bồi dễ đọc hơn)
    result = result
        .replace(/t$/g, ' tờ').replace(/k$/g, ' cờ').replace(/p$/g, ' pờ').replace(/s$/g, ' xờ')
        .replace(/l$/g, ' lờ').replace(/d$/g, ' dờ');

    return result.toUpperCase();
}

async function doSearch() {
    const word = document.getElementById('searchInput').value.trim();
    if (!word) return;
    const content = document.getElementById('mainContent');
    content.innerHTML = '<div style="text-align:center;padding:20px;">Đang phân tích âm...</div>';

    try {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const dictData = await dictRes.json();
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURI(word)}`);
        const transData = await transRes.json();

        let ipa = "";
        if(dictData[0]) {
            ipa = dictData[0].phonetic || (dictData[0].phonetics.find(p => p.text) || {}).text || "";
        }

        content.innerHTML = `
            <div class="result-card">
                <div class="word-en">${word.toLowerCase()}</div>
                <span class="ipa-label">IPA Gốc: ${ipa}</span>
                <div class="viet-phonetic">${processIPA(ipa)}</div>
                <div class="meaning-text">${transData[0][0][0]}</div>
            </div>`;

        // Phát âm
        const msg = new SpeechSynthesisUtterance(word);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);

    } catch (err) {
        content.innerHTML = `<div style="padding:20px;text-align:center;">Lỗi kết nối server!</div>`;
    }
}

document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
