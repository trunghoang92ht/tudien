<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TừĐiển Pro - Phiên Âm Chuẩn Vần</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1a1a2e; --card: #16213e; --yellow: #ffd166; --green: #06d6a0; --text: #eaeaea; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); padding: 20px 16px; }
        header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Baloo 2', cursive; font-size: 28px; color: var(--yellow); }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 15px; background: var(--card); border: 2px solid rgba(255,209,102,0.3); border-radius: 15px; color: #fff; font-size: 16px; outline: none; }
        .search-btn { background: var(--yellow); border: none; padding: 0 20px; border-radius: 15px; font-size: 20px; cursor: pointer; }
        .result-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .word-en { font-size: 32px; font-weight: 800; color: #fff; text-transform: capitalize; }
        .ipa { color: #8899bb; font-style: italic; margin-bottom: 10px; font-size: 14px; }
        .viet-phonetic { font-size: 22px; color: var(--green); background: rgba(6,214,160,0.1); padding: 18px; border-radius: 12px; text-align: center; margin: 15px 0; border-left: 5px solid var(--green); line-height: 1.6; font-weight: 700; }
        .stress { color: #fff; text-decoration: underline; font-size: 26px; }
        .btn-speak { background: #118ab2; border: none; color: #fff; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; position: absolute; right: 20px; top: 20px; }
        .meaning-text { font-size: 20px; font-weight: 700; color: #fff; margin-top: 15px; border-top: 1px solid #ffffff1a; padding-top: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">TừĐiển Pro</div>
        <p style="font-size: 12px; color: #8899bb">Bản cập nhật: Tự động ghép vần tiếng Việt</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Nhập từ (Vd: different)...">
        <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>

    <div id="mainContent"></div>

<script>
function smartVietPhonetic(ipa) {
    if (!ipa) return "";
    
    // Bước 1: Chuẩn hóa ký tự và đánh dấu trọng âm
    let raw = ipa.toLowerCase()
        .replace(/ˈ/g, ' STRESS ')
        .replace(/[^a-z ˈˌθðʃtʃdʒɔɒʊʌæəɪiːuː]/g, '');

    // Bước 2: Thay thế các cụm âm phức tạp trước
    let processed = raw
        .replace(/f/g, 'ph').replace(/r|ɹ/g, 'r')
        .replace(/θ/g, 'th').replace(/ð/g, 'đ')
        .replace(/ʃ/g, 'sh').replace(/tʃ/g, 'ch').replace(/dʒ/g, 'giờ')
        .replace(/ɔː|ɒ|ɔ/g, 'o').replace(/ʊ|uː/g, 'u').replace(/ʌ/g, 'ă')
        .replace(/æ|e/g, 'e').replace(/ə/g, 'ơ').replace(/ɪ|iː/g, 'i')
        .replace(/s/g, 'x').replace(/z/g, 'z')
        .replace(/n/g, 'n').replace(/m/g, 'm');

    // Bước 3: Xử lý vần đặc biệt (như 'rần', 'phờ')
    processed = processed
        .replace(/ph ơ n/g, 'phần')
        .replace(/r ơ n/g, 'rần')
        .replace(/t ơ n/g, 'tần')
        .replace(/st/g, 'x tờ').replace(/sp/g, 'x pờ')
        .replace(/t\b|t /g, ' tờ ').replace(/k\b|k /g, ' cờ ').replace(/p\b|p /g, ' pờ ');

    // Bước 4: Tách từ và xử lý trọng âm
    let units = processed.split(/\s+/).filter(u => u !== "");
    let finalOutput = [];
    let isStressed = false;

    units.forEach(unit => {
        if (unit === "stress") {
            isStressed = true;
        } else {
            let word = unit;
            if (isStressed) {
                // Thêm dấu sắc cho âm tiết có trọng âm
                word = word.replace(/([aeiouăơêôiy])/, '$1́');
                finalOutput.push(`<span class="stress">${word.toUpperCase()}</span>`);
                isStressed = false;
            } else {
                finalOutput.push(word.toLowerCase());
            }
        }
    });

    return finalOutput.join(' ').toUpperCase();
}

async function doSearch() {
    const word = document.getElementById('searchInput').value.trim();
    if (!word) return;
    const content = document.getElementById('mainContent');
    content.innerHTML = '<div style="text-align:center;padding:20px;">Đang xử lý vần...</div>';

    try {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const dictData = await dictRes.json();
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURI(word)}`);
        const transData = await transRes.json();

        let ipa = "";
        if(dictData[0]) {
            ipa = dictData[0].phonetic || (dictData[0].phonetics.find(p => p.text) || {}).text || "";
        }

        content.innerHTML = `
            <div class="result-card">
                <button class="btn-speak" onclick="speak('${word}')">🔊</button>
                <div class="word-en">${word}</div>
                <div class="ipa">${ipa}</div>
                <div class="viet-phonetic">${smartVietPhonetic(ipa)}</div>
                <div class="meaning-text">${transData[0][0][0]}</div>
            </div>`;
        speak(word);
    } catch (err) {
        content.innerHTML = `<div style="padding:20px;text-align:center;">Lỗi dữ liệu từ điển!</div>`;
    }
}

function speak(text) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'en-US';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}

document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
