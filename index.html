<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TừĐiển Pro - Phiên Bản Ổn Định</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .phonetic-box { font-size: 22px; color: #38bdf8; font-weight: bold; padding: 15px; background: #0f172a; border-radius: 10px; text-align: center; margin: 10px 0; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #f59e0b; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <input type="text" id="word" placeholder="Nhập từ cần tra...">
    <button onclick="traTu()">Tra cứu</button>
    <div id="ketqua"></div>

    <script>
    // Bảng dữ liệu mẫu cứng (Hard-coded) cho các từ hay sai, anh có thể thêm vào đây
    const customMap = { "different": "DI PHƠ RẦN TỜ", "much": "MẮT CHỜ", "business": "BÍT NÍT XỜ" };

    async function traTu() {
        const word = document.getElementById('word').value.toLowerCase().trim();
        if (customMap[word]) {
            document.getElementById('ketqua').innerHTML = `<div class='card'>Phiên âm: <div class='phonetic-box'>${customMap[word]}</div></div>`;
            return;
        }

        // Nếu không có trong danh sách, dùng thuật toán cải tiến
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const data = await res.json();
        if (data.title) { document.getElementById('ketqua').innerHTML = "Không tìm thấy!"; return; }
        
        let ipa = data[0].phonetic || "";
        // Chuyển IPA sang Việt hóa bằng cách thay thế trực tiếp theo bảng ký tự phổ biến
        let viet = ipa.replace(/ˈ/g, "").replace(/\//g, "").replace(/tʃ/g, "CH").replace(/dʒ/g, "D").replace(/θ/g, "TH").replace(/ə/g, "Ơ").replace(/ɪ/g, "I").replace(/æ/g, "E").replace(/ʌ/g, "Ă").replace(/ŋ/g, "NG");
        
        document.getElementById('ketqua').innerHTML = `<div class='card'>IPA gốc: ${ipa}<br>Phiên âm gợi ý: <div class='phonetic-box'>${viet}</div></div>`;
    }
    </script>
</body>
</html>
