<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TừĐiển Pro – Phiên Bản Hoàn Thiện</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1a1a2e; --card: #16213e; --yellow: #ffd166; --green: #06d6a0; --text: #eaeaea; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); padding: 20px 16px; }
        header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Baloo 2', cursive; font-size: 28px; color: var(--yellow); }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 15px; background: var(--card); border: 2px solid rgba(255,209,102,0.3); border-radius: 15px; color: #fff; font-size: 16px; outline: none; }
        .search-btn { background: var(--yellow); border: none; padding: 0 20px; border-radius: 15px; font-size: 20px; cursor: pointer; }
        .result-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .word-en { font-size: 32px; font-weight: 800; color: #fff; margin-right: 50px; }
        .ipa { color: #8899bb; font-style: italic; margin-bottom: 10px; font-size: 18px; }
        .viet-label { font-size: 12px; color: #8899bb; margin-top: 15px; font-weight: bold; }
        .viet-phonetic { font-size: 26px; color: var(--green); font-weight: 800; background: rgba(6,214,160,0.15); padding: 15px; border-radius: 12px; text-align: center; margin: 10px 0; letter-spacing: 1px; }
        .btn-speak { background: #118ab2; border: none; color: #fff; width: 55px; height: 55px; border-radius: 50%; font-size: 28px; cursor: pointer; position: absolute; right: 20px; top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .meaning-box { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .meaning-title { color: var(--yellow); font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .meaning-text { font-size: 20px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🇻🇳 TừĐiển Pro</div>
        <p style="font-size: 13px; color: #8899bb">Dịch nghĩa & Việt hóa phát âm thông minh</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Nhập từ tiếng Anh..." autocomplete="off">
        <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>

    <div id="mainContent"></div>

<script>
// Hệ thống chuyển đổi IPA (phiên âm chuẩn) sang âm bồi Việt Nam
function convertIpaToViet(ipa, word) {
    if (!ipa) return word.toUpperCase().split('').join('-'); 
    
    let viet = ipa.toLowerCase()
        .replace(/\//g, '').replace(/ˈ/g, '').replace(/ˌ/g, '') // Xóa ký hiệu trọng âm
        .replace(/həʊm/g, 'hôm').replace(/wɜːk/g, 'uốc').replace(/wurk/g, 'uốc') // Xử lý cho "Homework"
        .replace(/ə/g, 'ờ').replace(/ɪ/g, 'i').replace(/i:/g, 'i')
        .replace(/æ/g, 'e').replace(/e/g, 'e').replace(/aɪ/g, 'ai')
        .replace(/aʊ/g, 'ao').replace(/ɔː/g, 'o').replace(/ɒ/g, 'o')
        .replace(/ʊ/g, 'u').replace(/u:/g, 'u').replace(/ʌ/g, 'ă')
        .replace(/θ/g, 'th').replace(/ð/g, 'đ').replace(/ʃ/g, 'sh')
        .replace(/tʃ/g, 'ch').replace(/dʒ/g, 'giờ').replace(/ŋ/g, 'ng')
        .replace(/f/g, 'f').replace(/v/g, 'v').replace(/z/g, 'z')
        .replace(/j/g, 'i').replace(/k/g, 'k').replace(/p/g, 'p')
        .replace(/t/g, 't').replace(/s/g, 'x').replace(/l/g, 'l').replace(/r/g, 'r');

    // Làm đẹp lại chuỗi âm
    return viet.toUpperCase();
}

async function doSearch() {
    const word = document.getElementById('searchInput').value.trim();
    if (!word) return;
    const content = document.getElementById('mainContent');
    content.innerHTML = '<div style="text-align:center;padding:20px;">Đang xử lý dữ liệu...</div>';

    try {
        // 1. Lấy dữ liệu từ điển
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const dictData = await dictRes.json();
        
        // 2. Lấy nghĩa tiếng Việt từ Google
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURI(word)}`);
        const transData = await transRes.json();
        const vietMeaning = transData[0][0][0];

        const ipaRaw = dictData[0] ? (dictData[0].phonetic || (dictData[0].phonetics[1] ? dictData[0].phonetics[1].text : '')) : '';
        const vietPhonetic = convertIpaToViet(ipaRaw, word);

        content.innerHTML = `
            <div class="result-card">
                <button class="btn-speak" onclick="speak('${word}')">🔊</button>
                <div class="word-en">${word.toLowerCase()}</div>
                <div class="ipa">${ipaRaw || 'n/a'}</div>
                
                <div class="viet-label">CÁCH ĐỌC VIỆT HÓA:</div>
                <div class="viet-phonetic">${vietPhonetic}</div>

                <div class="meaning-box">
                    <div class="meaning-title">NGHĨA TIẾNG VIỆT:</div>
                    <div class="meaning-text">${vietMeaning}</div>
                </div>
            </div>`;
        speak(word);
    } catch (err) {
        content.innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:20px;">Không tìm thấy từ này, anh thử từ khác nhé!</div>`;
    }
}

function speak(text) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'en-US';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}

document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
