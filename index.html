<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Từ Điển Việt Hóa Toàn Năng</title>
<style>
  :root { --nen: #0f172a; --the: #1e293b; --xanh: #2dd4bf; --vang: #fbbf24; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--nen); color: white; padding: 20px; text-align: center; }
  .box { background: var(--the); padding: 25px; border-radius: 20px; border: 1px solid #334155; max-width: 500px; margin: auto; }
  input { width: 80%; padding: 15px; border-radius: 12px; border: none; font-size: 18px; margin-bottom: 15px; font-weight: bold; }
  button { background: var(--vang); border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
  #ketQua { margin-top: 25px; font-size: 32px; font-weight: 800; color: var(--xanh); line-height: 1.5; }
  .nghia { font-size: 18px; color: #94a3b8; margin-top: 10px; font-style: italic; }
</style>
</head>
<body>

<div class="box">
  <h2 style="color: var(--vang)">VIỆT HÓA 100%</h2>
  <input type="text" id="tuKho" placeholder="Nhập từ bất kỳ..." onkeypress="if(event.key==='Enter') xửLý()">
  <br>
  <button onclick="xửLý()">CHUYỂN SANG TIẾNG VIỆT</button>
  
  <div id="ketQua"></div>
  <div id="nghia" class="nghia"></div>
</div>

<script>
// BẢNG QUY ĐỔI ÂM THANH SANG CHỮ VIỆT CHUẨN
const DICTIONARY_MAP = {
  'p': 'pờ', 'b': 'bờ', 't': 'tờ', 'd': 'dờ', 'k': 'cờ', 'g': 'gờ',
  'f': 'phờ', 'v': 'vờ', 's': 'sờ', 'z': 'zờ', 'h': 'hờ', 'm': 'mờ',
  'n': 'nờ', 'l': 'lờ', 'r': 'rờ', 'w': 'u', 'j': 'i',
  'ʃ': 'sờ', 'ʒ': 'dờ', 'tʃ': 'chờ', 'dʒ': 'gi', 'θ': 'thờ', 'ð': 'đờ',
  'eɪ': 'ây', 'aɪ': 'ai', 'ɔɪ': 'oi', 'aʊ': 'ao', 'əʊ': 'âu', 
  'ɪə': 'ia', 'eə': 'e ơ', 'ʊə': 'ua', 'iː': 'i', 'ɪ': 'i',
  'æ': 'e', 'e': 'e', 'ɑː': 'a', 'ɒ': 'o', 'ɔː': 'ô',
  'ʊ': 'u', 'uː': 'u', 'ʌ': 'ă', 'ɜː': 'ơ', 'ə': 'ơ'
};

async function xửLý() {
  const tu = document.getElementById('tuKho').value.trim().toLowerCase();
  if (!tu) return;

  try {
    // Gọi API để lấy âm thanh chuẩn (IPA)
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${tu}`);
    const data = await res.json();
    
    // Lấy nghĩa tiếng Việt
    const resHán = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${tu}`);
    const dataHán = await resHán.json();

    let ipa = "";
    if (data[0] && data[0].phonetics) {
      ipa = data[0].phonetic || data[0].phonetics.find(p => p.text)?.text || "";
    }

    if (!ipa) {
      document.getElementById('ketQua').innerText = "Chưa có dữ liệu âm!";
      return;
    }

    // Tiến hành "Việt hóa" từ âm IPA
    let phienAmViet = convertIpaToViet(ipa);
    
    document.getElementById('ketQua').innerText = phienAmViet;
    document.getElementById('nghia').innerText = dataHán[0][0][0];

    // Phát âm mẫu
    const msg = new SpeechSynthesisUtterance(tu);
    msg.lang = 'en-US';
    window.speechSynthesis.speak(msg);

  } catch (err) {
    document.getElementById('ketQua').innerText = "Lỗi kết nối!";
  }
}

function convertIpaToViet(ipa) {
  let text = ipa.replace(/[\/\b]/g, '').trim();
  
  // Xử lý trọng âm thành dấu SẮC cho âm tiết đó
  text = text.replace(/ˈ([^aeiouæɑɒɔəʊʌiuv]*)([aeiouæɑɒɔəʊʌiuv])/g, '$1$2́');

  // Sắp xếp các ký tự IPA dài trước để không bị ghi đè
  const keys = Object.keys(DICTIONARY_MAP).sort((a, b) => b.length - a.length);
  
  keys.forEach(key => {
    const regex = new RegExp(key, 'g');
    text = text.replace(regex, ' ' + DICTIONARY_MAP[key] + ' ');
  });

  // Làm sạch và viết hoa theo đúng ý anh
  return text.trim()
             .toUpperCase()
             .replace(/\s+/g, ' ')
             .replace(/SỜẦN/g, 'SẦN') // Sửa lỗi tion
             .replace(/Ớ/g, 'Ớ').replace(/Ế/g, 'Ế').replace(/Á/g, 'Á').replace(/É/g, 'É').replace(/Í/g, 'Í').replace(/Ố/g, 'Ố').replace(/Ú/g, 'Ú');
}
</script>
</body>
</html>
