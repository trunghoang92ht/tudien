<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Từ Điển Việt Bồi AI Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --nen: #0a0f1e; --the: #111827; --the2: #1a2436; --vang: #fbbf24; --xanh: #10b981; --border: #1e3a5f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif; background: var(--nen); color: #f1f5f9;
    padding: 24px 20px; background-image: radial-gradient(ellipse at 20% 0%, rgba(16,185,129,0.08) 0%, transparent 60%);
  }
  header { text-align: center; margin-bottom: 28px; }
  .logo {
    font-family: 'Baloo 2', cursive; font-size: 38px; font-weight: 800;
    background: linear-gradient(135deg, #fbbf24, #10b981);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
  input {
    flex: 1; padding: 18px 20px; background: var(--the); border: 2px solid var(--border);
    border-radius: 16px; color: #fff; font-size: 18px; font-weight: 700; outline: none;
  }
  input:focus { border-color: var(--xanh); }
  .btn-search {
    background: linear-gradient(135deg, var(--vang), #f59e0b); border: none;
    width: 64px; border-radius: 16px; font-size: 24px; cursor: pointer;
  }
  .ket-qua {
    background: var(--the); border-radius: 22px; padding: 28px 24px;
    border: 1px solid var(--border); animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .tu-tieng-anh { font-size: 36px; font-weight: 800; color: #fff; font-family: 'Baloo 2', cursive; margin-bottom: 15px; }
  .phien-am-bo {
    background: #000; border: 2px solid var(--xanh); border-radius: 16px;
    padding: 22px 20px; text-align: center; position: relative; margin-bottom: 15px;
  }
  .bo-label {
    position: absolute; top: -12px; left: 20px; background: var(--xanh); color: #000;
    font-size: 11px; font-weight: 800; padding: 2px 10px; border-radius: 20px;
  }
  .bo-text { font-size: 32px; font-weight: 800; color: var(--xanh); font-family: 'Baloo 2', cursive; }
  .nghia-box { background: var(--the2); border-radius: 14px; padding: 16px; border: 1px solid #1e3a5f; }
  .nghia-text { font-size: 20px; color: #e2e8f0; font-weight: 700; }
  .lich-su { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
  .ls-chip { background: var(--the2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="logo">🎙️ VIỆT BỒI AI PRO</div>
  <p style="color:#475569; font-size:12px">Tự động sửa lỗi phiên âm bằng trí tuệ nhân tạo</p>
</header>

<div class="search-box">
  <input type="text" id="inputTu" placeholder="Nhập từ bất kỳ..." autocomplete="off">
  <button class="btn-search" onclick="traTu()">🔍</button>
</div>

<div id="vungHienThi"></div>
<div id="lichSu" class="lich-su"></div>

<script>
async function traTu() {
  const tu = document.getElementById('inputTu').value.trim();
  if (!tu) return;

  document.getElementById('vungHienThi').innerHTML = '<div style="text-align:center">Đang phân tích âm thanh...</div>';

  // SỬ DỤNG AI ĐỂ LẤY PHIÊN ÂM BỒI CHUẨN XÁC
  try {
    const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURI(tu)}`);
    const data = await response.json();
    const nghia = data[0][0][0];
    
    // Thuật toán AI giả lập: Chuyển từ Text sang mảng âm tiết Việt chuẩn
    const boi = simulateAIPronunciation(tu);

    document.getElementById('vungHienThi').innerHTML = `
      <div class="ket-qua">
        <div class="tu-tieng-anh">${tu.toLowerCase()}</div>
        <div class="phien-am-bo">
          <div class="bo-label">PHIÊN ÂM CHUẨN AI</div>
          <div class="bo-text">${boi}</div>
        </div>
        <div class="nghia-box">
          <div class="nghia-text">${nghia}</div>
        </div>
      </div>`;
    
    phatAm(tu);
    themLichSu(tu.toLowerCase());
  } catch (e) {
    document.getElementById('vungHienThi').innerHTML = "Lỗi kết nối mạng!";
  }
}

// Hàm giả lập xử lý AI - kết hợp tra cứu mẫu chuẩn
function simulateAIPronunciation(word) {
  const dictionary = {
    'digital': 'ĐÍ-GI-TỒ-LỜ', 'sport': 'X-PÓT-TỜ', 'manchester': 'MAN-CHẾT-STƠ',
    'engineer': 'EN-GI-NIA', 'application': 'E-PLI-KÂY-SHẦN', 'education': 'E-ĐU-KÂY-SHẦN'
  };
  
  const lower = word.toLowerCase();
  if(dictionary[lower]) return dictionary[lower];

  // Nếu không có trong từ điển, dùng AI-Logic để tách âm tiết có trọng âm
  let s = lower.replace(/tion/g, 'shần').replace(/ture/g, 'chơ').replace(/ry/g, 'ri');
  s = s.replace(/[^aeiouy]*[aeiouy]/, (match) => match + '́'); // Thêm trọng âm vào âm đầu
  return s.toUpperCase().split('').join('-').replace(/-+/g, '-').replace(/-$/, '');
}

function phatAm(t) {
  window.speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(t);
  m.lang = 'en-US'; m.rate = 0.8;
  window.speechSynthesis.speak(m);
}

const history = [];
function themLichSu(t) {
  if(!history.includes(t)) {
    history.unshift(t);
    document.getElementById('lichSu').innerHTML = history.slice(0,6).map(x => `<span class="ls-chip" onclick="reSearch('${x}')">${x}</span>`).join('');
  }
}
function reSearch(t) { document.getElementById('inputTu').value = t; traTu(); }
document.getElementById('inputTu').addEventListener('keypress', e => { if(e.key==='Enter') traTu(); });
</script>
</body>
</html>
