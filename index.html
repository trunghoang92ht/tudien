<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Việt Hóa Tiếng Anh Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #fbbf24;
            --accent: #2dd4bf;
            --text: #f1f5f9;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at top right, rgba(45, 212, 191, 0.1), transparent);
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            text-align: center;
        }

        h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .sub-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: #0f172a;
            color: white;
            font-size: 18px;
            font-weight: 700;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        button:active { transform: scale(0.97); }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            background: #0f172a;
            border-radius: 20px;
            border: 1px dashed var(--accent);
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .boi-text {
            font-family: 'Baloo 2', cursive;
            font-size: 38px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.2;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .meaning {
            font-size: 18px;
            color: #94a3b8;
            font-weight: 600;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VIỆT HÓA 100%</h1>
    <p class="sub-title">Đọc tiếng Anh chuẩn như tiếng Việt</p>

    <div class="input-group">
        <input type="text" id="tuInput" placeholder="Nhập từ tiếng Anh..." onkeypress="if(event.key==='Enter') traTu()">
    </div>

    <button onclick="traTu()">CHUYỂN SANG TIẾNG VIỆT</button>

    <div id="resultBox" class="result-box">
        <div id="boiOutput" class="boi-text"></div>
        <div id="meaningOutput" class="meaning"></div>
    </div>

    <div class="footer">Dành riêng cho người Việt • Dễ đọc • Dễ nhớ</div>
</div>

<script>
    // BỘ NÃO ƯU TIÊN - LUÔN ĐÚNG THEO Ý ANH
    const DATABASE = {
        'cat': 'KÉ TỜ',
        'book': 'BÚ CỜ',
        'application': 'E PỜ LI CÂY SẦN',
        'digital': 'ĐÍ GI TỒ LỜ',
        'sport': 'X PÓT TỜ',
        'map': 'MÉ PỜ',
        'sit': 'XÍ TỜ',
        'dog': 'ĐÓ GỜ',
        'engineer': 'EN GI NIA',
        'school': 'X CU LỜ'
    };

    async function traTu() {
        const word = document.getElementById('tuInput').value.trim().toLowerCase();
        if (!word) return;

        let phienAmViet = "";
        let nghiaViet = "...";

        // 1. Kiểm tra bảng tra cứu ưu tiên
        if (DATABASE[word]) {
            phienAmViet = DATABASE[word];
        } else {
            // 2. Thuật toán dự phòng (ghép vần mượt)
            phienAmViet = logicVietHoa(word);
        }

        // 3. Lấy nghĩa từ Google
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(word)}`);
            const data = await res.json();
            nghiaViet = data[0][0][0];
        } catch (e) {
            nghiaViet = "Không tìm thấy nghĩa";
        }

        // Hiển thị kết quả
        document.getElementById('boiOutput').innerText = phienAmViet;
        document.getElementById('meaningOutput').innerText = nghiaViet;
        document.getElementById('resultBox').style.display = 'block';

        // Phát âm để anh nghe nhịp
        phatAm(word);
    }

    function logicVietHoa(word) {
        let s = word;
        
        // Thay các cụm âm cố định
        s = s.replace(/tion/g, ' sần').replace(/ture/g, ' chơ').replace(/ple/g, ' pờ lờ');
        
        // Tách âm đuôi
        s = s.replace(/p$/g, ' pờ').replace(/t$/g, ' tờ').replace(/k$/g, ' cờ')
             .replace(/s$/g, ' sờ').replace(/d$/g, ' dờ').replace(/l$/g, ' lờ');

        // Việt hóa nguyên âm đơn
        s = s.replace(/a/g, 'e').replace(/o/g, 'ô').replace(/u/g, 'u').replace(/i/g, 'i');

        // Thêm trọng âm giả định vào âm tiết đầu
        let parts = s.trim().split(/\s+/);
        if (parts.length > 0) {
            parts[0] = parts[0].replace(/[eiouô]/i, (m) => m + '́');
        }

        return parts.join(' ').toUpperCase()
                    .replace(/É/g, 'É').replace(/Í/g, 'Í').replace(/Ú/g, 'Ú').replace(/Ố/g, 'Ố')
                    .replace(/\s+/g, ' ');
    }

    function phatAm(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'en-US';
        m.rate = 0.8;
        window.speechSynthesis.speak(m);
    }
</script>

</body>
</html>
