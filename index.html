<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TừĐiển Pro - Phiên Bản 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1a1a2e; --card: #16213e; --yellow: #ffd166; --green: #06d6a0; --text: #eaeaea; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); padding: 20px 16px; min-height: 100vh; }
        header { text-align: center; margin-bottom: 25px; }
        .logo { font-family: 'Baloo 2', cursive; font-size: 32px; color: var(--yellow); text-shadow: 2px 2px rgba(0,0,0,0.3); }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 18px; background: var(--card); border: 2px solid rgba(255,209,102,0.2); border-radius: 18px; color: #fff; font-size: 18px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--yellow); box-shadow: 0 0 15px rgba(255,209,102,0.2); }
        .search-btn { background: var(--yellow); border: none; width: 60px; border-radius: 18px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .result-card { background: var(--card); border-radius: 25px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); position: relative; animation: fadeIn 0.5s ease; }
        .word-en { font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .ipa-label { color: #8899bb; font-size: 14px; margin-bottom: 15px; display: block; }
        .viet-phonetic { font-size: 28px; color: var(--green); background: rgba(6,214,160,0.1); padding: 25px; border-radius: 20px; text-align: center; margin: 20px 0; border: 1px dashed var(--green); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .meaning-text { font-size: 22px; font-weight: 700; color: var(--yellow); padding-top: 15px; border-top: 1px solid #ffffff1a; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <div class="logo">TừĐiển Pro</div>
        <p style="font-size: 13px; color: #8899bb">Hệ thống phiên âm AI thông minh</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Nhập từ tiếng Anh..." autocomplete="off">
        <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>

    <div id="mainContent"></div>

<script>
async function doSearch() {
    const word = document.getElementById('searchInput').value.trim();
    if (!word) return;
    const content = document.getElementById('mainContent');
    content.innerHTML = '<div style="text-align:center;padding:30px;color:#8899bb">Đang phân tích âm bồi...</div>';

    try {
        // Lấy nghĩa và phiên âm "âm bồi" từ Google API
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&dt=rm&q=${encodeURI(word)}`;
        const res = await fetch(url);
        const data = await res.json();

        // data[0][0][0] là nghĩa tiếng Việt
        // data[0][1] thường chứa phần phiên âm Latinh của Google
        let vietMeaning = data[0][0][0];
        let rawPhonetic = (data[0][1] && data[0][1][3]) ? data[0][1][3] : word;

        // Xử lý làm sạch âm bồi để dễ đọc kiểu tiếng Việt
        let cleanPhonetic = rawPhonetic
            .replace(/ˌ|ˈ/g, '')
            .replace(/t/g, ' tờ')
            .replace(/p/g, ' pờ')
            .replace(/k/g, ' cờ')
            .trim();

        content.innerHTML = `
            <div class="result-card">
                <div class="word-en">${word.toLowerCase()}</div>
                <span class="ipa-label">Phiên âm tiếng Việt dễ đọc:</span>
                <div class="viet-phonetic">${cleanPhonetic}</div>
                <div class="meaning-text">${vietMeaning}</div>
            </div>`;
            
        // Phát âm mẫu
        const msg = new SpeechSynthesisUtterance(word);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);

    } catch (err) {
        content.innerHTML = `<div style="padding:20px;text-align:center;">Lỗi kết nối dữ liệu!</div>`;
    }
}

document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
