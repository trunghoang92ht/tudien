<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TừĐiển Pro – Phiên Âm Chuẩn Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1a1a2e; --card: #16213e; --yellow: #ffd166; --green: #06d6a0; --text: #eaeaea; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); padding: 20px 16px; }
        header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Baloo 2', cursive; font-size: 28px; color: var(--yellow); }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 15px; background: var(--card); border: 2px solid rgba(255,209,102,0.3); border-radius: 15px; color: #fff; font-size: 16px; outline: none; }
        .search-btn { background: var(--yellow); border: none; padding: 0 20px; border-radius: 15px; font-size: 20px; cursor: pointer; }
        .result-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .word-en { font-size: 32px; font-weight: 800; color: #fff; text-transform: lowercase; }
        .ipa { color: #8899bb; font-style: italic; margin-bottom: 10px; font-size: 16px; }
        .viet-phonetic { font-size: 26px; color: var(--green); font-weight: 800; background: rgba(6,214,160,0.15); padding: 18px; border-radius: 12px; text-align: center; margin: 15px 0; border-left: 5px solid var(--green); text-transform: uppercase; }
        .btn-speak { background: #118ab2; border: none; color: #fff; width: 55px; height: 55px; border-radius: 50%; font-size: 28px; cursor: pointer; position: absolute; right: 20px; top: 20px; }
        .meaning-box { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .meaning-text { font-size: 20px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🇻🇳 TừĐiển Pro</div>
        <p style="font-size: 13px; color: #8899bb">Hệ thống phiên âm tiếng Việt thông minh</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ví dụ: sport, different..." autocomplete="off">
        <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>

    <div id="mainContent"></div>

<script>
// Bộ lọc âm bồi chuẩn xác theo âm thanh
function smartVietPhonetic(ipa, word) {
    let raw = (ipa || word).toLowerCase().replace(/[\/ˈˌː]/g, '');

    // 1. Xử lý các tổ hợp phụ âm khó (giống Katakana)
    const rules = [
        { eng: 'sp', vi: 'x-pơ' }, { eng: 'st', vi: 'x-tơ' }, { eng: 'sk', vi: 'x-cơ' },
        { eng: 'ts', vi: 't-xờ' }, { eng: 'tr', vi: 't-rờ' }, { eng: 'dr', vi: 'đ-rờ' },
        { eng: 'ɔ', vi: 'o' }, { eng: 'æ', vi: 'e' }, { eng: 'ə', vi: 'ơ' },
        { eng: 'θ', vi: 'th' }, { eng: 'ð', vi: 'đ' }, { eng: 'ʃ', vi: 'sh' },
        { eng: 'tʃ', vi: 'ch' }, { eng: 'dʒ', vi: 'giờ' },
        { eng: 'ʊ', vi: 'u' }, { eng: 'ʌ', vi: 'ă' }
    ];

    let result = raw;
    rules.forEach(r => { result = result.split(r.eng).join(r.vi); });

    // 2. Thêm đuôi "-tờ", "-cờ"... cho các phụ âm kết thúc từ
    if (result.endsWith('t')) result = result.slice(0, -1) + '-tờ';
    if (result.endsWith('k')) result = result.slice(0, -1) + '-cờ';
    if (result.endsWith('s')) result = result.slice(0, -1) + '-xờ';
    if (result.endsWith('d')) result = result.slice(0, -1) + '-dờ';
    if (result.endsWith('p')) result = result.slice(0, -1) + '-pờ';

    // 3. Xử lý riêng các từ anh hay tra
    const fixed = {
        'sport': 'X-PÓ-TỜ',
        'different': 'ĐI-PHƠ-RƠN-TỜ',
        'homework': 'HÔM-UỐC-CỜ',
        'elephant': 'E-LÊ-PHẦN-TỜ'
    };
    
    return fixed[word.toLowerCase()] || result.toUpperCase();
}

async function doSearch() {
    const word = document.getElementById('searchInput').value.trim();
    if (!word) return;
    const content = document.getElementById('mainContent');
    content.innerHTML = '<div style="text-align:center;padding:20px;">Đang tra...</div>';

    try {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const dictData = await dictRes.json();
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURI(word)}`);
        const transData = await transRes.json();

        let ipa = "";
        if(dictData[0]) {
            ipa = dictData[0].phonetic || (dictData[0].phonetics.find(p => p.text) || {}).text || "";
        }

        content.innerHTML = `
            <div class="result-card">
                <button class="btn-speak" onclick="speak('${word}')">🔊</button>
                <div class="word-en">${word}</div>
                <div class="ipa">${ipa}</div>
                <div class="viet-phonetic">${smartVietPhonetic(ipa, word)}</div>
                <div class="meaning-box">
                    <div class="meaning-text">${transData[0][0][0]}</div>
                </div>
            </div>`;
        speak(word);
    } catch (err) {
        content.innerHTML = `<div style="padding:20px;text-align:center;">Lỗi mạng hoặc không tìm thấy từ!</div>`;
    }
}

function speak(text) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'en-US';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}

document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
